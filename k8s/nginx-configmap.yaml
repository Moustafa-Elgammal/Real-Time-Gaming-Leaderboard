apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    worker_processes auto;

    events {
      worker_connections 4096;
      use epoll;
      multi_accept on;
    }

    http {
      upstream app_backend {
        server app-backend:8080;
        keepalive 64;           # persistent connection pool to upstream pods
        keepalive_requests 2000;
        keepalive_timeout  65s;
      }

      server {
        listen 80;

        # Disable buffering globally — required for SSE (GET /v1/scores/stream)
        proxy_buffering off;
        proxy_cache    off;

        location / {
          proxy_pass         http://app_backend;
          proxy_http_version 1.1;          # required for upstream keepalive
          proxy_set_header   Connection ""; # clear so upstream sees persistent conn

          proxy_set_header Host            $host;
          proxy_set_header X-Real-IP       $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          chunked_transfer_encoding on;
          proxy_read_timeout 3600s;
        }
      }
    }
