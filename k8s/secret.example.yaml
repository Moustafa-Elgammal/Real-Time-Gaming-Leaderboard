# Template only. Do not commit real values.
# Usage: cp secret.example.yaml secret.yaml, edit it, then run `make secret`.
# secret.yaml is git-ignored.
apiVersion: v1
kind: Secret
metadata:
  name: my-secret
type: Opaque
stringData:
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  LEADERBOARD_PREFIX: leaderboard
  TOP_N: "10"
  USER_NEIGHBORHOOD: "4"
  MYSQL_ROOT_PASSWORD: change-me
  # Must use the same password as MYSQL_ROOT_PASSWORD.
  DB_DSN: root:change-me@tcp(mysql:3306)/leaderboard?parseTime=true
  BATCH_FLUSH_MS: "100"
  BATCH_SIZE: "500"
  DB_MAX_OPEN_CONNS: "10"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME_S: "300"
  DB_CONN_MAX_IDLE_TIME_S: "120"
  # Shared secret with the game service. Empty disables auth.
  INTERNAL_API_KEY: ""
