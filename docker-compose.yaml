services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: leaderboard
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redis:6379
      - DB_DSN=root:password@tcp(mysql:3306)/leaderboard?parseTime=true
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/scores"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles:
      - test

  # ── Load testing stack ───────────────────────────────────────────────────────
  # Start with: docker compose --profile load-test up -d influxdb grafana
  # Then run:   docker compose --profile load-test run --rm k6 run /scripts/full-suite.js
  #             docker compose --profile load-test run --rm k6 run /scripts/01-score-updates.js
  # Dashboard:  http://localhost:3000  (admin / admin)

  influxdb:
    image: influxdb:1.8
    profiles:
      - load-test
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:10.4.3
    profiles:
      - load-test
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb

  k6:
    # v0.48.0 is the last release with native --out influxdb (InfluxDB v1) support.
    # v0.49+ removed it; the K6_OUT env var is always applied regardless of
    # which script is passed via `docker compose run`, avoiding command-override issues.
    image: grafana/k6:0.48.0
    profiles:
      - load-test
    volumes:
      - ./k6/scripts:/scripts
      - ./k6/utils:/utils
      - ./k6/reports:/reports
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - BASE_URL=http://app:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
    command: run /scripts/full-suite.js
    depends_on:
      app:
        condition: service_healthy
      influxdb:
        condition: service_started

volumes:
  influxdb_data:
  grafana_data:
