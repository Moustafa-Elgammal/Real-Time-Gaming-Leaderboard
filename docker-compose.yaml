services:

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles:
      - test
